##
## nginx.conf - Local stand-in for the S2 ALB listener rules.
##
## Routes requests to the correct micro-service by path prefix.
## In production (S2), the ALB target-group rules handle this instead.
##

server {
    listen 80;

    # Recommendation service
    location /recommendations/ {
        proxy_pass  http://catalogue:5002;
    }

    # Auth service
    location = /login {
        proxy_pass  http://catalogue:5003;
    }

    # Default: catalogue service
    location / {
        proxy_pass  http://catalogue:5001;
    }
}
